name: Query podcast transcription status

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/query-podcast-transcription-status.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Query transcript workflow runs and cancel podcast duplicates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p research/transcription_run_status
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow transcribe-podcast-audio.yml \
            --limit 10 \
            --json databaseId,status,conclusion,createdAt,updatedAt,url,headSha,displayTitle \
            > research/transcription_run_status/latest_runs.json

          KEEP_ID=$(jq -r '[.[] | select(.status != "completed")] | sort_by(.createdAt) | .[0].databaseId // empty' research/transcription_run_status/latest_runs.json)
          jq -r --arg keep "$KEEP_ID" '.[] | select(.status != "completed") | select((.databaseId|tostring) != $keep) | .databaseId' \
            research/transcription_run_status/latest_runs.json \
            | while read -r DUPLICATE_ID; do
                [ -n "$DUPLICATE_ID" ] || continue
                echo "Cancelling duplicate transcription run $DUPLICATE_ID"
                gh run cancel "$DUPLICATE_ID" --repo "$GITHUB_REPOSITORY" || true
              done

          PODCAST_ID=$(jq -r '.[0].databaseId // empty' research/transcription_run_status/latest_runs.json)
          if [ -n "$PODCAST_ID" ]; then
            gh run view "$PODCAST_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --json databaseId,status,conclusion,createdAt,updatedAt,url,jobs \
              > research/transcription_run_status/latest_run.json
          fi

          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow fetch-external-youtube-transcripts.yml \
            --limit 5 \
            --json databaseId,status,conclusion,createdAt,updatedAt,url,headSha,displayTitle \
            > research/transcription_run_status/external_runs.json

          EXTERNAL_ID=$(jq -r '.[0].databaseId // empty' research/transcription_run_status/external_runs.json)
          if [ -n "$EXTERNAL_ID" ]; then
            gh run view "$EXTERNAL_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --json databaseId,status,conclusion,createdAt,updatedAt,url,jobs \
              > research/transcription_run_status/external_run.json
          fi

          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow extract-fishing-knowledge.yml \
            --limit 5 \
            --json databaseId,status,conclusion,createdAt,updatedAt,url,headSha,displayTitle \
            > research/transcription_run_status/knowledge_runs.json || true

          KNOWLEDGE_ID=$(jq -r '.[0].databaseId // empty' research/transcription_run_status/knowledge_runs.json 2>/dev/null || true)
          if [ -n "$KNOWLEDGE_ID" ]; then
            gh run view "$KNOWLEDGE_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --json databaseId,status,conclusion,createdAt,updatedAt,url,jobs \
              > research/transcription_run_status/knowledge_run.json
          fi

      - name: Commit status snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/transcription_run_status
          if git diff --cached --quiet; then
            echo 'No workflow status changes to commit.'
          else
            git commit -m 'Update transcript workflow status'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep $((attempt * 3))
            done
            exit 1
          fi

